apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.common.namespace }}
spec:
  replicas: {{ .Values.todoapp.spec.replicas }}
  strategy:
    type: {{ .Values.todoapp.spec.strategy.type }}
    {{- if eq .Values.todoapp.spec.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.todoapp.spec.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.todoapp.spec.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: secrets-reader
      containers:
      - name: {{ .Chart.Name }}
        image: {{ .Values.todoapp.image.repository}}:{{ .Values.todoapp.image.version}}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: app-secrets-volume
          mountPath: "/app/secrets"
          readOnly: true
        - name: app-config-volume
          mountPath: "/app/configs"
          readOnly: true
        resources:
          requests:
            memory: {{ .Values.todoapp.resources.requests.memory}}
            cpu: {{ .Values.todoapp.resources.requests.cpu}}
          limits:
            memory: {{ .Values.todoapp.resources.limits.memory}}
            cpu: {{ .Values.todoapp.resources.limits.cpu}}
        env:
        {{- toYaml .Values.todoapp.env | nindent 8 }}
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-data
      - name: app-secrets-volume
        secret:
          secretName: app-secret
      - name: app-config-volume
        configMap:
          name: app-config
      affinity:
      {{- toYaml .Values.todoapp.spec.affinity | nindent 8 }}